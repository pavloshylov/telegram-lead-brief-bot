# Bot + PostgreSQL. Usage: cp .env.example .env (fill BOT_TOKEN, ADMIN_IDS), then: docker compose up -d --build
services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:-change-me}@db:5432/bot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
